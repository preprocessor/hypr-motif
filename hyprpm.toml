[repository]
name = "hypr-CDE-borders"
authors = ["wyspr"]

# Each pair is [Hyprland commit, plugin commit]. hyprpm matches the running Hyprland's
# exact commit and resets the plugin to the paired commit, so a pin is how an older
# compositor keeps building after the source moves on.
commit_pins = [
    # v0.56.2: the last plugin commit that still built against it.
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "ebb4160664c442df2cbee7949558c76d879e6544"],
]

[cde]
description = "Common Desktop Environment (Motif) window chrome for Hyprland"
authors = ["wyspr"]
output = "cde.so"
build = [
    "make all",
]
